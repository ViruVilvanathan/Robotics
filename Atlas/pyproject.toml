[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.2.0"
description = "Modular robotics and autonomy simulation platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
